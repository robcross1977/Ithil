name: Release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore Ithil.slnx

      - name: Build
        run: dotnet build Ithil.slnx --no-restore --configuration Release

      - name: Test
        run: >
          dotnet test Ithil.slnx
          --no-build
          --configuration Release
          --filter "FullyQualifiedName!~PlaywrightTests"

  publish-nuget:
    name: Publish NuGet
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Pack Ithil.Hosting
        run: >
          dotnet pack src/Ithil.Hosting/Ithil.Hosting.csproj
          --configuration Release
          -p:PackageVersion=${{ github.ref_name }}
          --output ./nupkg

      - name: Pack Ithil.Attributes
        run: >
          dotnet pack src/Ithil.Attributes/Ithil.Attributes.csproj
          --configuration Release
          -p:PackageVersion=${{ github.ref_name }}
          --output ./nupkg

      - name: Push to NuGet.org
        run: dotnet nuget push ./nupkg/*.nupkg --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json

  publish-docker:
    name: Publish Docker
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ithilsoftware/gateway:latest
            ithilsoftware/gateway:${{ steps.version.outputs.version }}
