name: CI

on:
  push:
    branches: [trunk]
  pull_request:
    branches: [trunk]

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore Ithil.slnx

      - name: Build
        run: dotnet build Ithil.slnx --no-restore --configuration Release

      # Playwright tests are excluded here and run in the dedicated `e2e` job below,
      # so a browser problem never masks a unit-test result (or vice versa).
      #
      # These run per-project rather than as `dotnet test Ithil.slnx --filter ...`
      # because xunit v3 runs on Microsoft.Testing.Platform, which treats a project
      # that matches zero tests as an error (exit code 8). A solution-wide name filter
      # would therefore always fail on the Playwright project. Excluding by project
      # keeps a genuine "zero tests ran" regression an error, which is the point.
      #
      # Ithil.Integration.Tests is skipped because it is not a member of Ithil.slnx
      # and so is never built by the Build step above.
      - name: Test (unit + integration)
        run: |
          set -euo pipefail
          for proj in tests/*/*.csproj; do
            case "$proj" in
              *PlaywrightTests*) continue ;;
              *Integration.Tests*) continue ;;
            esac
            echo "::group::$proj"
            dotnet test "$proj" --no-build --configuration Release
            echo "::endgroup::"
          done

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      # Browser builds are pinned to the Microsoft.Playwright version, so the cache is
      # keyed on <PlaywrightVersion> from the test csproj rather than on a lockfile.
      # Bumping the package misses the cache, and the build step below then downloads
      # the matching browsers automatically.
      - name: Resolve Playwright version
        id: pw
        run: |
          csproj=tests/Ithil.Dashboard.PlaywrightTests/Ithil.Dashboard.PlaywrightTests.csproj
          version=$(sed -n 's|.*<PlaywrightVersion>\(.*\)</PlaywrightVersion>.*|\1|p' "$csproj" | head -1)
          if [ -z "$version" ]; then
            echo "Could not read <PlaywrightVersion> from $csproj" >&2
            exit 1
          fi
          echo "Playwright version: $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

      # The InstallPlaywrightBrowsers target in the test csproj installs browsers that
      # match the driver version. PlaywrightInstallArgs adds the OS-level packages that
      # Chromium needs on a bare Linux runner.
      - name: Build (installs matching browsers)
        run: >
          dotnet build tests/Ithil.Dashboard.PlaywrightTests/Ithil.Dashboard.PlaywrightTests.csproj
          --configuration Release
          -p:PlaywrightInstallArgs=--with-deps

      - name: Test (E2E)
        run: >
          dotnet test tests/Ithil.Dashboard.PlaywrightTests/Ithil.Dashboard.PlaywrightTests.csproj
          --no-build
          --configuration Release
