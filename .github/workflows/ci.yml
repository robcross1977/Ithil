name: CI

on:
  push:
    branches: [trunk]
  pull_request:
    branches: [trunk]

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore Ithil.slnx

      - name: Build
        run: dotnet build Ithil.slnx --no-restore --configuration Release

      - name: Test (unit + integration)
        run: >
          dotnet test Ithil.slnx
          --no-build
          --configuration Release
          --filter "FullyQualifiedName!~PlaywrightTests"
